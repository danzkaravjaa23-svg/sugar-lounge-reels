# main руу push хийх бүрт Mac програмыг GitHub-ийн macOS машин дээр бүтээж,
# "latest" release-д zip-ээр хавсаргана → хэн ч вэбээс татаж авч болно.
name: Mac app

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 = Xcode 16 / Swift 6 SDK: WebKit delegate-ийн @MainActor гарын үсэг locally (SDK 15.5) ашигласантай таарна;
    # macos-14 (Swift 5.10) дээр delegate-үүд таарахгүй, compiler унадаг
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null || true
          swiftc --version
          xcodebuild -version | head -1

      - name: Build Sugar Lounge Reels.app
        run: |
          chmod +x scripts/build-mac-app.sh
          scripts/build-mac-app.sh --no-install

      - name: Self-test (export + save a reel headlessly)
        run: |
          swiftc -O scripts/make_fixtures.swift -o dist/make_fixtures
          mkdir -p test-fixtures
          dist/make_fixtures test-fixtures/vid-a.mp4 3.2 0.48 0.12 0.31
          dist/make_fixtures test-fixtures/vid-b.mp4 4.5 0.12 0.31 0.48
          python3 scripts/make_test_photos.py test-fixtures
          python3 scripts/make_test_music.py 124
          "dist/Sugar Lounge Reels.app/Contents/MacOS/SugarLoungeReels" --selftest "$PWD/test-fixtures" "$PWD/dist/selftest"

      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent "Sugar Lounge Reels.app" "Sugar-Lounge-Reels-mac.zip"
          ls -la "Sugar-Lounge-Reels-mac.zip"

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP="$(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "dist/Sugar-Lounge-Reels-mac.zip" \
            --title "Sugar Lounge Reels — Mac ($STAMP)" \
            --notes-file .github/release-notes.md
